---
apiVersion: v1
kind: Pod
metadata:
  name: sb-kafka-pub-pod
  namespace: sb-kafka
  labels:
    label.service: sb-kafka-pub-k #must be the same as in service.yaml services label
spec:
  containers:
    - name: sb-kafka-pub-k
      image: localhost:5000/sb_kafka_pub_k
      imagePullPolicy: IfNotPresent
      env:
        - name: SPRING_PROFILES_ACTIVE
          value: "Publisher,k8s"
        - name: URL_HOST_MYSQL
          valueFrom:
            configMapKeyRef:
              name: config-env-server-sb-kafka-k
              key: mysql.url
        - name: URL_PORT_MYSQL
          valueFrom:
            configMapKeyRef:
              name: config-env-server-sb-kafka-k
              key: mysql.port
        - name: DB_MYSQL
          valueFrom:
            configMapKeyRef:
              name: config-env-server-sb-kafka-k
              key: mysql.database
        - name: URL_HOST_KAFKA
          valueFrom:
            configMapKeyRef:
              name: config-env-server-sb-kafka-k
              key: spring.kafka.url
        - name: URL_PORT_KAFKA
          valueFrom:
            configMapKeyRef:
              name: config-env-server-sb-kafka-k
              key: spring.kafka.port
        - name: URL_HOST_REDIS
          valueFrom:
            configMapKeyRef:
              name: config-env-server-sb-kafka-k
              key: redis.address.url
        - name: URL_PORT_REDIS
          valueFrom:
            configMapKeyRef:
              name: config-env-server-sb-kafka-k
              key: redis.port
      ports:
        - containerPort: 8081
          name: sb-kaf-pub-svc
  initContainers:
    - name: wait-mysql
      image: localhost:5000/sb_kafka_pub_k
      command: [ "sh", "-c", "until nc -z mysql-s.sb-kafka.svc.cluster.local 3306; do echo Waiting for mysql; sleep 2; done;" ]
    - name: wait-redis
      image: localhost:5000/sb_kafka_pub_k
      command: [ "sh", "-c", "until nc -z redis-s.sb-kafka.svc.cluster.local 6379; do echo Waiting for redis; sleep 2; done;" ]
    - name: wait-kafka
      image: localhost:5000/sb_kafka_pub_k
      command: [ "sh", "-c", "until nc -z kafka-s.sb-kafka.svc.cluster.local 9092; do echo Waiting for kafka; sleep 2; done;" ]


---
