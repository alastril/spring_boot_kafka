services:
  redis:
    image: redis:latest
    restart: always
    ports:
      - "6389:6379"
    volumes:
      - /path/to/local/dаta:/root/redis
      - /path/to/local/redis.conf:/usr/local/etc/redis/redis.conf
    environment:
      - REDIS_PASSWORD=root
      - REDIS_PORT=6379
      - REDIS_DATABASES=16
  kafka-controller-1:
    image: confluentinc/cp-kafka:latest
    environment:
      CLUSTER_ID: "your_unique_cluster_id1"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: controller
      KAFKA_LISTENERS: CONTROLLER://:9095
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-controller-1:9095
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  kafka:
    image: confluentinc/cp-kafka:latest
    ports:
      - 9095:9095
    environment:
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_NODE_ID: 2
      CLUSTER_ID: "your_unique_cluster_id1"
      KAFKA_PROCESS_ROLES: broker
      KAFKA_LISTENERS: 'PLAINTEXT://:19095,PLAINTEXT_HOST://:9095'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:19095,PLAINTEXT_HOST://host.docker.internal:9095'
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-controller-1:9095
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    depends_on:
      - kafka-controller-1
  mysql:
    image: mysql:latest
#    container_name: mysql
    restart: always
    environment:
      #      TZ: Europe/Kiev
      MYSQL_USER: test
      MYSQL_PASSWORD: test
      MYSQL_DATABASE: kafka_db
      MYSQL_ROOT_PASSWORD: root
      MYSQL_ROOT_HOST: '%'
    command: mysqld --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-time-zone=UTC
    ports:
      - '3303:3306'
    volumes:
      - mysql:/var/lib/mysql
volumes:
  mysql:
    driver: local
