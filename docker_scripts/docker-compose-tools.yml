name: spring_boot_kafka
services:
  registry:
    image: registry:2
    restart: always
    ports:
      - "5000:5000"
    environment:
      REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY: /data
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    volumes:
      - /register_data:/data
  redis:
    image: redis:latest
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - /path/to/local/dаta:/root/redis
      - /path/to/local/redis.conf:/usr/local/etc/redis/redis.conf
    environment:
      REDIS_PASSWORD: root
      REDIS_PORT: 6379
      REDIS_DATABASES: 16
    depends_on:
      - mysql
  kafka-controller:
    image: confluentinc/cp-kafka:7.8.7
    container_name: kafka-controller
    environment:
      CLUSTER_ID: "your_unique_cluster_id1"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: controller
      KAFKA_LISTENERS: CONTROLLER_MAIN://:9091
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER_MAIN
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-controller:9091
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  kafka:
    image: confluentinc/cp-kafka:7.8.7
    container_name: kafka-broker
    ports:
      - 9092:9092
    environment:
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_NODE_ID: 2
      CLUSTER_ID: "your_unique_cluster_id1"
      KAFKA_PROCESS_ROLES: broker
      KAFKA_LISTENERS: 'LISTENER_INTERNAL://:19092,HOST://:9092,DOCKER://:9093'
      KAFKA_ADVERTISED_LISTENERS: 'LISTENER_INTERNAL://kafka-broker:19092, HOST://localhost:9092,DOCKER://kafka:9093'
      KAFKA_INTER_BROKER_LISTENER_NAME: LISTENER_INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER_BROKER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER_BROKER:PLAINTEXT,LISTENER_INTERNAL:PLAINTEXT,HOST:PLAINTEXT, DOCKER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-controller:9091
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    depends_on:
      - kafka-controller
  mysql:
    image: mysql:latest
    container_name: mysql
    restart: always
    environment:
      #      TZ: Europe/Kiev
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: kafka_db
      MYSQL_ROOT_HOST: '%'
    command: mysqld --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-time-zone=UTC
    ports:
      - '3306:3306'
    volumes:
      - mysql:/var/lib/mysql
  sonarqube:
    image: sonarqube:lts-community
    depends_on:
      - sonar_db
    restart: always
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar_db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    ports:
      - "9000:9000"
    volumes:
      - sonarqube_conf:/opt/sonarqube/conf
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_temp:/opt/sonarqube/temp
  sonar_db:
    image: postgres:17.2
    restart: always
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    volumes:
      - sonar_db:/var/lib/postgresql
      - sonar_db_data:/var/lib/postgresql/data
volumes:
  mysql:
    driver: local
  sonarqube_conf:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  sonarqube_temp:
  sonar_db:
  sonar_db_data:
  register_data: